<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simulado VR">
<meta name="theme-color" content="#0f766e">
<title>Simulado Enfermagem VR</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1a1d23;--mut:#5d6470;--bd:#dde1e7;--pri:#0f766e;--pri2:#0d5f59;--prifg:#fff;--sel:#e3f3f1;--ok:#15803d;--okbg:#e6f5eb;--bad:#b91c1c;--badbg:#fdecec;--warnbg:#fdf6e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f25;--fg:#e8eaed;--mut:#9aa3ad;--bd:#2d333b;--pri:#2bb3a6;--pri2:#25998e;--prifg:#06201d;--sel:#16332f;--ok:#4ade80;--okbg:#12291a;--bad:#f87171;--badbg:#2e1515;--warnbg:#2b250f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.35rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 12px}
.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-size:.9rem;margin:12px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
textarea{min-height:80px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:11px 14px}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg);font-weight:600}
button.pri:hover{background:var(--pri2)}
button.link{border:0;background:none;color:var(--pri);padding:4px 0;text-decoration:underline}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin-top:8px}
.info{color:var(--ok);font-size:.9rem;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.top>button{white-space:nowrap;flex:0 0 auto}
.badge{display:inline-block;font-size:.75rem;padding:3px 8px;border-radius:99px;background:var(--sel);color:var(--pri);font-weight:600;white-space:nowrap}
.badge.off{background:var(--badbg);color:var(--bad)}
.texto{background:var(--bg);border-left:3px solid var(--pri);padding:10px 12px;border-radius:6px;font-size:.95rem;margin-bottom:12px;white-space:pre-line}
.enun{white-space:pre-line}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-top:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--card)}
.opt b{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.opt.on{border-color:var(--pri);background:var(--sel)}.opt.on b{background:var(--pri);color:var(--prifg);border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{padding:7px 0;font-size:.85rem}
.grid .ans{background:var(--sel);border-color:var(--pri)}.grid .cur{outline:2px solid var(--pri)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.big{font-size:2.4rem;font-weight:700;line-height:1.1}
.res{padding:12px;border-radius:10px;margin:12px 0;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pri)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px}
.coment{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--warnbg);font-size:.92rem}
.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1}
.altrow{display:flex;gap:8px;align-items:center;margin-top:8px}.altrow input[type=radio]{width:22px;height:22px;flex:0 0 22px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}.chk input{width:20px;height:20px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
.tbl{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">Carregando…</div></div>
<script src="config.js"></script>
<script>
const CFG = window.SIMULADO_CONFIG || {};
const ONLINE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const TURNSTILE_JS = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
const CAPTCHA = ONLINE && !!CFG.turnstileSiteKey;
// Mesma ordem de supabase/gera-seed.js (os IDs dependem dela)
const LOCAL_FILES = [
  'questoes.js', 'banco/_formatos.js',
  'banco/pt-sus.js', 'banco/tec-1.js', 'banco/tec-2.js', 'banco/enf-1.js', 'banco/enf-2.js',
  'banco/pt-2.js', 'banco/pt-3.js', 'banco/sus-2.js', 'banco/sus-3.js',
  'banco/tec-3.js', 'banco/tec-4.js', 'banco/tec-5.js', 'banco/tec-6.js', 'banco/tec-7.js', 'banco/tec-8.js',
  'banco/enf-3.js', 'banco/enf-4.js', 'banco/enf-5.js', 'banco/enf-6.js', 'banco/enf-7.js', 'banco/enf-8.js',
  'banco/fechamento.js'
];
const AREAS = { pt: 'Língua Portuguesa', sus: 'Legislação do SUS', esp: 'Conhecimentos Específicos' };
const AREAS_DB = { pt: 'Português', sus: 'SUS', tec: 'Técnico', enf: 'Enfermeiro' };
const CARGOS = { tec: 'Técnico em Enfermagem', enf: 'Enfermeiro' };
const MODOS = { completo: 'Simulado completo', area: 'Treino por área', erradas: 'Treino das erradas' };
const L = 'ABCDE';

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.floor(s || 0); return [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(n => String(n).padStart(2, '0')).join(':'); };
const areaOf = q => (q.area === 'tec' || q.area === 'enf') ? 'esp' : q.area;
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const loadScript = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); });

let sb = null, ME = null, BANK = [], BY_ID = {}, TXT = {}, HIST = [], CUR = null;
let ui = { view: 'loading', tab: 'in', cargo: 'tec' };
let timerId = null;
let captchaToken = null, cfWidget = null, turnstileP = null;
const loadTurnstile = () => turnstileP || (turnstileP = loadScript(TURNSTILE_JS));

// ======================= Acesso a dados =======================
async function hash(s) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return 'f' + (h >>> 0).toString(16);
}

// Modo local: contas e histórico no navegador, questões dos arquivos .js
const LocalAPI = {
  async init() { for (const f of LOCAL_FILES) await loadScript(f); },
  async session() { const u = ls.get('simVR_session'); return u && ls.get('simVR_users', {})[u] ? { id: u, nome: u, admin: false } : null; },
  async signUp(login, senha) {
    const users = ls.get('simVR_users', {});
    login = login.trim().toLowerCase();
    if (!/^[a-z0-9._-]{3,30}$/.test(login)) throw new Error('Usuário: 3 a 30 caracteres (letras, números, . _ -).');
    if (users[login]) throw new Error('Esse usuário já existe.');
    const salt = Math.random().toString(36).slice(2);
    users[login] = { salt, hash: await hash(salt + senha) };
    ls.set('simVR_users', users); ls.set('simVR_session', login);
    return { id: login, nome: login, admin: false };
  },
  async signIn(login, senha) {
    login = login.trim().toLowerCase();
    const u = ls.get('simVR_users', {})[login];
    if (!u || u.hash !== await hash(u.salt + senha)) throw new Error('Usuário ou senha incorretos.');
    ls.set('simVR_session', login);
    return { id: login, nome: login, admin: false };
  },
  async signOut() { ls.del('simVR_session'); },
  async loadBank() {
    const qs = [];
    const add = (lista, area) => lista.forEach((q, i) => qs.push({ id: area + '-' + String(i + 1).padStart(3, '0'), area, txt: q.txt || null, t: q.t, o: q.o, c: 0, e: q.e || '', ativa: true }));
    add(Q_PT, 'pt'); add(Q_SUS, 'sus'); add(Q_TEC, 'tec'); add(Q_ENF, 'enf');
    return { questoes: qs, textos: Object.assign({}, TEXTOS) };
  },
  async history() { return ls.get('simVR_hist_' + ME.id, []); },
  // No modo local a correção é feita aqui; no online, pela função finalizar_prova do banco
  async finalizar(p) {
    const por = {}, resultado = {};
    p.questoes.forEach(({ id }) => {
      const q = BY_ID[id], a = areaOf(q), acertou = p.respostas[id] === q.c;
      por[a] = por[a] || { a: 0, n: 0 }; por[a].n++;
      if (acertou) por[a].a++;
      resultado[id] = acertou;
    });
    const acertos = Object.values(por).reduce((t, x) => t + x.a, 0);
    const reg = Object.assign({}, p, {
      resultado, acertos, total: p.questoes.length, por_area: por, criada_em: new Date().toISOString(),
      aprovado: p.modo === 'completo' ? acertos >= 35 && Object.values(por).every(x => x.a > 0) : null
    });
    const h = ls.get('simVR_hist_' + ME.id, []);
    h.push(reg); ls.set('simVR_hist_' + ME.id, h);
    return reg;
  },
  async gabarito() { return []; }
};

// Modo online: Supabase (login real, banco de questões e histórico no servidor)
const traduz = e => {
  const m = (e && e.message) || String(e);
  const map = [
    [/Invalid login credentials/i, 'E-mail ou senha incorretos.'],
    [/already registered/i, 'Esse e-mail já tem conta. Use a aba Entrar.'],
    [/at least 6 characters/i, 'A senha precisa ter pelo menos 6 caracteres.'],
    [/Email not confirmed/i, 'Confirme seu e-mail pelo link que enviamos antes de entrar.'],
    [/valid email|invalid format/i, 'Digite um e-mail válido.'],
    [/email rate limit/i, 'O cadastro está temporariamente indisponível (limite de e-mails do servidor). Tente mais tarde ou avise o administrador.'],
    [/captcha/i, 'Confirme a verificação "não sou um robô" e tente de novo.'],
    [/rate limit|too many/i, 'Muitas tentativas. Aguarde alguns minutos.'],
    [/Failed to fetch|NetworkError/i, 'Sem conexão com o servidor. Verifique sua internet.']
  ];
  for (const [r, t] of map) if (r.test(m)) return new Error(t);
  return new Error(m);
};
// Para alunos, "correta" e "comentario" só chegam depois (meu_gabarito), para questões já feitas
const fromDb = r => ({ id: r.id, area: r.area, txt: r.texto_id, t: r.enunciado, o: r.alternativas, c: r.correta ?? null, e: r.comentario ?? '', ativa: r.ativa });
const toDb = q => ({ id: q.id, area: q.area, texto_id: q.txt || null, enunciado: q.t, alternativas: q.o, correta: q.c, comentario: q.e, ativa: q.ativa });
const ok = ({ data, error }) => { if (error) throw traduz(error); return data; };

const OnlineAPI = {
  async init() {
    await loadScript(SUPABASE_JS);
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => go('novaSenha'), 0); });
  },
  async profile(user) {
    const p = ok(await sb.from('perfis').select('nome,admin').eq('id', user.id).maybeSingle());
    return { id: user.id, email: user.email, nome: (p && p.nome) || user.email, admin: !!(p && p.admin) };
  },
  async session() { const { data } = await sb.auth.getSession(); return data.session ? this.profile(data.session.user) : null; },
  async signUp(email, senha, nome, captcha) {
    const data = ok(await sb.auth.signUp({ email: email.trim(), password: senha, options: { data: { nome: nome.trim() }, emailRedirectTo: location.origin + location.pathname, captchaToken: captcha || undefined } }));
    if (!data.session) return { confirmar: true };
    return this.profile(data.user);
  },
  async signIn(email, senha, captcha) { const data = ok(await sb.auth.signInWithPassword({ email: email.trim(), password: senha, options: { captchaToken: captcha || undefined } })); return this.profile(data.user); },
  async signOut() { await sb.auth.signOut(); },
  async resetSenha(email, captcha) { ok(await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname, captchaToken: captcha || undefined })); },
  async novaSenha(s) { ok(await sb.auth.updateUser({ password: s })); },
  async loadBank() {
    const qs = [];
    for (let de = 0; ; de += 1000) {
      const req = ME.admin ? sb.rpc('admin_questoes') : sb.from('questoes').select('id,area,texto_id,enunciado,alternativas,ativa').order('id');
      const page = ok(await req.range(de, de + 999));
      qs.push(...page);
      if (page.length < 1000) break;
    }
    const t = ok(await sb.from('textos').select('*'));
    return { questoes: qs.map(fromDb), textos: Object.fromEntries(t.map(x => [x.id, x.conteudo])) };
  },
  async history() { return ok(await sb.from('tentativas').select('*').eq('user_id', ME.id).order('criada_em')); },
  async finalizar(p) {
    return ok(await sb.rpc('finalizar_prova', { p_cargo: p.cargo, p_modo: p.modo, p_area: p.area, p_questoes: p.questoes, p_respostas: p.respostas, p_tempo: p.tempo }));
  },
  async gabarito() {
    // A API devolve no máximo 1.000 linhas por chamada; com o banco grande, busca em páginas
    const todos = [];
    for (let de = 0; ; de += 1000) {
      const page = ok(await sb.rpc('meu_gabarito').range(de, de + 999));
      todos.push(...page);
      if (page.length < 1000) break;
    }
    return todos;
  },
  async saveQuestion(q) { ok(await sb.rpc('admin_salvar_questao', { q: toDb(q) })); },
  async deleteQuestion(id) { ok(await sb.rpc('admin_excluir_questao', { p_id: id })); },
  async saveTexto(id, conteudo) { ok(await sb.from('textos').upsert({ id, conteudo })); },
  async alunos() {
    const perfis = ok(await sb.from('perfis').select('id,nome'));
    const tent = ok(await sb.from('tentativas').select('user_id,cargo,modo,acertos,total,aprovado,criada_em').order('criada_em'));
    return { perfis, tent };
  }
};
const API = ONLINE ? OnlineAPI : LocalAPI;

async function carregar() {
  const b = await API.loadBank();
  BANK = b.questoes; TXT = b.textos;
  BY_ID = Object.fromEntries(BANK.map(q => [q.id, q]));
  await aplicarGabarito();
  HIST = await API.history();
  ui.cargo = ls.get('simVR_cargo_' + ME.id, 'tec');
  CUR = ls.get('simVR_cur_' + ME.id, null);
  if (CUR) { CUR.ids = CUR.ids.filter(id => BY_ID[id]); if (!CUR.ids.length) CUR = null; }
}
const saveCur = () => CUR ? ls.set('simVR_cur_' + ME.id, CUR) : ls.del('simVR_cur_' + ME.id);
async function aplicarGabarito() {
  (await API.gabarito()).forEach(g => { const q = BY_ID[g.id]; if (q) { q.c = g.correta; q.e = g.comentario; } });
}

// ======================= Sorteio das provas =======================
// last[id] = quando a questão apareceu por último; lastOk[id] = se acertou da última vez
function estat() {
  const last = {}, lastOk = {};
  HIST.forEach(h => {
    const t = Date.parse(h.criada_em) || 0;
    h.questoes.forEach(x => {
      last[x.id] = t;
      lastOk[x.id] = h.resultado ? !!h.resultado[x.id] : !!BY_ID[x.id] && h.respostas[x.id] === BY_ID[x.id].c;
    });
  });
  return { last, lastOk };
}
const ativas = area => BANK.filter(q => q.ativa && q.area === area);
const areasDoCargo = c => ['pt', 'sus', c];

function montar(modo, area, n) {
  const c = ui.cargo, { last, lastOk } = estat();
  // Inéditas primeiro (em ordem aleatória); depois as vistas há mais tempo
  const pick = (ar, k) => {
    const pool = ativas(ar);
    const novas = shuffle(pool.filter(q => !(q.id in last)));
    const vistas = shuffle(pool.filter(q => q.id in last)).sort((a, b) => last[a.id] - last[b.id]);
    return novas.concat(vistas).slice(0, k);
  };
  let qs;
  if (modo === 'completo') qs = [...pick('pt', 10), ...pick('sus', 10), ...pick(c, 50)];
  else if (modo === 'area') qs = pick(area === 'esp' ? c : area, n);
  else qs = shuffle(areasDoCargo(c).flatMap(ativas).filter(q => lastOk[q.id] === false)).slice(0, n);
  const ord = { pt: 0, sus: 1 };
  qs.sort((a, b) => ((ord[a.area] ?? 2) - (ord[b.area] ?? 2)) || (a.area === 'pt' && b.area === 'pt' ? (a.txt || 99) - (b.txt || 99) : 0));
  return {
    cargo: c, modo, area: modo === 'area' ? area : null,
    ids: qs.map(q => q.id),
    ordem: Object.fromEntries(qs.map(q => [q.id, shuffle([0, 1, 2, 3, 4])])),
    ans: {}, i: 0, el: 0
  };
}

// ======================= Navegação =======================
function go(v, extra) { clearInterval(timerId); Object.assign(ui, { view: v }, extra || {}); render(); window.scrollTo(0, 0); }
function render() {
  if (!ME && !['login', 'novaSenha', 'erro', 'loading'].includes(ui.view)) ui.view = 'login';
  const views = { login: vLogin, novaSenha: vNovaSenha, home: vHome, exam: vExam, result: vResult, review: vReview, admin: vAdmin, editar: vEditar, erro: vErro };
  (views[ui.view] || vHome)();
}
function vErro() { $('#app').innerHTML = `<div class="card"><h2>Não foi possível carregar</h2><p>${esc(ui.msg)}</p><button class="pri" onclick="location.reload()">Tentar de novo</button></div>`; }

// ---------- Login / cadastro ----------
function vLogin() {
  const t = ui.tab, reg = t === 'up', rec = t === 'rec';
  const idLabel = ONLINE ? 'E-mail' : 'Usuário';
  $('#app').innerHTML = `
  <div class="card" style="margin-top:6vh">
    <h1>Simulado Enfermagem</h1>
    <p class="mut">Prefeitura de Volta Redonda/RJ · Edital 003/2026-SMA · banca FEVRE</p>
    ${rec ? '<h2>Recuperar senha</h2>' : `<div class="tabs"><button data-t="in" class="${reg ? '' : 'on'}">Entrar</button><button data-t="up" class="${reg ? 'on' : ''}">Criar conta</button></div>`}
    <form id="f">
      ${reg && ONLINE ? '<label>Nome</label><input id="nome" autocomplete="name" required>' : ''}
      <label>${idLabel}</label><input id="u" ${ONLINE ? 'type="email" autocomplete="email"' : 'autocomplete="username" autocapitalize="none"'} required>
      ${rec ? '' : `<label>Senha</label><input id="p" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required>`}
      ${reg ? '<label>Confirmar senha</label><input id="p2" type="password" autocomplete="new-password" required>' : ''}
      ${CAPTCHA ? '<div id="cf" style="margin-top:14px;min-height:65px"></div>' : ''}
      <div class="err" id="err"></div><div class="info" id="info"></div>
      <button class="pri full" style="margin-top:6px" id="sub">${rec ? 'Enviar link de recuperação' : reg ? 'Criar conta' : 'Entrar'}</button>
    </form>
    ${ONLINE ? (rec ? '<button class="link" data-t="in">Voltar ao login</button>' : '<button class="link" data-t="rec">Esqueci minha senha</button>') : '<p class="mut" style="margin-top:14px">Modo local: as contas e o histórico ficam salvos só neste aparelho.</p>'}
  </div>`;
  $$('[data-t]').forEach(b => b.onclick = () => { ui.tab = b.dataset.t; render(); });
  // Verificação anti-robô (Cloudflare Turnstile), exigida pelo Supabase quando o CAPTCHA está ligado
  captchaToken = null; cfWidget = null;
  if (CAPTCHA) loadTurnstile().then(() => {
    if (!$('#cf')) return;
    cfWidget = turnstile.render('#cf', {
      sitekey: CFG.turnstileSiteKey, language: 'pt-br',
      callback: t => { captchaToken = t; },
      'expired-callback': () => { captchaToken = null; },
      'error-callback': () => { captchaToken = null; }
    });
  }).catch(() => { $('#err').textContent = 'Não foi possível carregar a verificação anti-robô. Recarregue a página.'; });
  const novoCaptcha = () => { try { if (CAPTCHA && cfWidget !== null && $('#cf')) { turnstile.reset(cfWidget); captchaToken = null; } } catch (e) {} };
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const err = $('#err'), info = $('#info'), sub = $('#sub');
    err.textContent = info.textContent = '';
    const u = $('#u').value, p = rec ? '' : $('#p').value;
    if (reg && p.length < 6) return err.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    if (reg && p !== $('#p2').value) return err.textContent = 'As senhas não conferem.';
    if (CAPTCHA && !captchaToken) return err.textContent = 'Confirme a verificação "não sou um robô".';
    sub.disabled = true;
    try {
      if (rec) { await API.resetSenha(u, captchaToken); info.textContent = 'Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.'; return; }
      const r = reg ? await API.signUp(u, p, ONLINE ? $('#nome').value : u, captchaToken) : await API.signIn(u, p, captchaToken);
      if (r && r.confirmar) { info.textContent = 'Conta criada! Abra o link que enviamos para o seu e-mail e depois entre aqui.'; ui.tab = 'in'; return; }
      ME = r; await carregar(); go('home');
    } catch (e) { err.textContent = traduz(e).message; }
    finally { sub.disabled = false; novoCaptcha(); }
  };
}

function vExam() {
  const s = CUR;
  if (!s) return go('home');
  const q = BY_ID[s.ids[s.i]], ordem = s.ordem[q.id], n = s.ids.length, done = Object.keys(s.ans).length;
  $('#app').innerHTML = `
  <div class="top"><button id="back">← Painel</button><span class="timer" id="tm">${fmt(s.el)}</span><button class="pri" id="fin">Finalizar</button></div>
  <div class="card">
    <div class="top" style="margin-bottom:8px"><b>Questão ${s.i + 1} de ${n}</b><span class="badge">${AREAS[areaOf(q)]}</span></div>
    ${q.txt && TXT[q.txt] ? `<div class="texto"><b>Texto</b><br>${esc(TXT[q.txt])}</div>` : ''}
    <div class="enun">${esc(q.t)}</div>
    ${ordem.map((orig, k) => `<button class="opt ${s.ans[q.id] === orig ? 'on' : ''}" data-o="${orig}"><b>${L[k]}</b><span>${esc(q.o[orig])}</span></button>`).join('')}
    <div class="nav"><button id="prev" ${s.i ? '' : 'disabled'}>← Anterior</button><button id="next" class="pri" ${s.i < n - 1 ? '' : 'disabled'}>Próxima →</button></div>
  </div>
  <div class="card"><div class="top" style="margin:0"><b>Mapa de questões</b><span class="mut">${done}/${n} respondidas</span></div>
    <div class="grid">${s.ids.map((id, k) => `<button data-g="${k}" class="${s.ans[id] !== undefined ? 'ans' : ''} ${k === s.i ? 'cur' : ''}">${k + 1}</button>`).join('')}</div>
  </div>`;
  const move = i => { s.i = i; saveCur(); go('exam'); };
  $$('.opt').forEach(b => b.onclick = () => {
    const o = +b.dataset.o;
    if (s.ans[q.id] === o) delete s.ans[q.id]; else s.ans[q.id] = o;
    saveCur(); vExam();
  });
  $$('[data-g]').forEach(b => b.onclick = () => move(+b.dataset.g));
  $('#prev').onclick = () => move(s.i - 1);
  $('#next').onclick = () => move(s.i + 1);
  $('#back').onclick = () => go('home');
  $('#fin').onclick = () => {
    const falta = n - Object.keys(s.ans).length;
    if (confirm(falta ? `Ainda há ${falta} questão(ões) sem resposta. Finalizar mesmo assim?` : 'Finalizar e ver o resultado?')) finish();
  };
  clearInterval(timerId);
  timerId = setInterval(() => { s.el++; const t = $('#tm'); if (t) t.textContent = fmt(s.el); if (s.el % 5 === 0) saveCur(); }, 1000);
}

async function finish() {
  clearInterval(timerId);
  const s = CUR;
  const prova = {
    cargo: s.cargo, modo: s.modo, area: s.area,
    questoes: s.ids.map(id => ({ id, ordem: s.ordem[id] })), respostas: s.ans, tempo: s.el
  };
  try {
    HIST.push(await API.finalizar(prova));
    await aplicarGabarito();
    CUR = null; saveCur();
    go('result', { h: HIST.length - 1 });
  } catch (e) {
    alert('Não foi possível salvar o resultado: ' + traduz(e).message + '\nSuas respostas continuam guardadas; tente finalizar de novo.');
    go('exam');
  }
}

  try {
    await API.init();
    ME = await API.session();
    if (ME) await carregar();
    if (ui.view === 'loading') go(ME ? 'home' : 'login');
  } catch (e) { go('erro', { msg: traduz(e).message }); }
})();
</script>
